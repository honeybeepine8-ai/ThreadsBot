# ============================================================
# 相互引用リポスト設定
# ============================================================
# CrossPosterAgent が使用する設定。
# アカウント間で自然な相互引用を行い、リーチを拡大する。

enabled: true

# 引用候補として選ぶ投稿の条件
candidate_criteria:
  min_views: 200               # 最低閲覧数
  min_engagement_rate: 0.03    # 最低エンゲージメント率
  max_age_hours: 72            # 投稿からの最大経過時間
  min_age_hours: 6             # 投稿からの最小経過時間（即座に引用しない）

# 引用の制約
limits:
  max_cross_posts_per_day: 3         # 全アカウント合計の日次上限
  min_interval_hours: 24             # 同一ペア間の最低間隔
  max_same_pair_per_week: 2          # 同一ペアの週間上限
  cross_post_rate: 0.15              # 候補の15%を実際に引用

# 引用コメント生成
comment:
  min_length: 30
  max_length: 200
  include_persona_perspective: true  # ペルソナ固有の視点を入れる
  pr_label_required: false           # 引用リポストにPR表記は不要

# スケジュール
schedule:
  run_interval_hours: 8              # 8時間ごとに実行
  active_hours:
    start: 8
    end: 22
