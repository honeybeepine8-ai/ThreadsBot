# ============================================================
# アフィリエイト商品カタログ
# Fetcher（後乗せ）/ Replier（プロフ誘導CTA）が参照
# ============================================================

# --- ASP設定 ---
asp_accounts:
  - name: "A8.net"
    tracking_param: "a8mat"
  - name: "afb"
    tracking_param: "afb_id"

# --- 商品カタログ ---
