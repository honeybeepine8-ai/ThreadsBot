# ============================================================
# UGCテンプレート設定
# フォロワーが引用リポストで自分バージョンを投稿したくなる
# 穴埋め式テンプレートを曜日ごとに定義
# ============================================================

templates:
  - name: "スキンケアルーティン公開"
    schedule_day: "金"
    hashtag: "#成分ルーティン晒し"
    template: |
      今の私のスキンケア、全部晒す。

      朝：___
      夜：___
      週1スペシャル：___

      一番変わったのは___。

      みんなのルーティンも見たい。
      引用で教えて👇

  - name: "推し成分プレゼン"
    schedule_day: "火"
    hashtag: "#推し成分プレゼン"
    template: |
      私の推し成分、聞いてくれ。

      成分名：___
      推す理由：___
      こう使うと最強：___

      あなたの推し成分は？
      引用で教えて👇

  - name: "やめてよかったケア"
    schedule_day: "水"
    hashtag: "#やめてよかったケア"
    template: |
      やめたら肌変わったこと。

      やめたこと：___
      きっかけ：___
      変わったこと：___

      意外とみんな同じもの多い。
      引用で教えて👇

  - name: "成分表クイズ"
    schedule_day: "日"
    hashtag: "#成分表チャレンジ"
    template: |
      この成分、何番目に書いてあったら「ちゃんと入ってる」？

      成分：___
      正解：___
      理由：___

      成分表って見方知るだけで選び方変わるよね。
