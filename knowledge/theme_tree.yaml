# ============================================================
# テーマツリー（V2）
# Researcher, Analyst が参照するコンテンツ戦略の階層構造
# リーフノードごとにリサーチカバレッジを追跡する
# 目標カバレッジ率: 80%以上を維持
# リーフノード合計: 約46個
# ============================================================

skincare_ingredients:  # 成分解説（メインコンテンツ）
  保湿成分:
    - セラミド（種類・見分け方: NP/AP/EOP）
    - ヒアルロン酸（分子量の違い: 高分子/低分子/ナノ化）
    - スクワラン（植物性vs動物性）
    - グリセリン（濃度と使用感）
    - ヘパリン類似物質
  美白・ブライトニング成分:
    - ナイアシンアミド（濃度と効果の関係）
    - ビタミンC誘導体（種類: AA-2G/APPS/VCエチル、安定性の違い）
    - トラネキサム酸
    - アルブチン（αとβの違い）
    - コウジ酸
  エイジングケア成分:
    - レチノール（濃度・使い方・A反応の注意）
    - ペプチド（種類と作用機序）
    - コエンザイムQ10
    - バクチオール（レチノール代替）
  肌荒れ・鎮静成分:
    - シカ（ツボクサエキス: TECA, マデカッソシド）
    - アラントイン
    - グリチルリチン酸2K
    - パンテノール
  注意が必要な成分:
    # ※ 「ダメ」ではなく「知っておくべき」スタンスで
    - エタノール（高濃度配合のデメリット）
    - 合成香料（刺激リスク）
    - 防腐剤（パラベン vs フェノキシエタノール）

skincare_knowledge:  # 基礎知識
  成分表の読み方:
    - 配合順のルール（1%以上は多い順、1%以下は順不同）
    - 「〇〇配合」のカラクリ（微量でも書ける）
    - 医薬部外品と化粧品の成分表示の違い
    - 全成分表示の読み解き方
  肌の仕組み:
    - バリア機能とラメラ構造
    - ターンオーバー（28日周期の真実）
    - pH値と肌の関係（弱酸性の意味）
    - 経皮吸収の限界（角質層まで）
  よくある誤解:
    - オーガニック=安全？
    - 「無添加」の法的定義
    - 高い=良い？（価格と成分の関係）
    - 「浸透する」の正しい理解

skincare_routine:  # ルーティン・使い方
  基本のステップ:
    - 朝と夜の違い
    - 塗る順番の根拠（水→油の原則）
    - 適量の目安
  季節別ケア:
    - 冬の乾燥対策
    - 夏の紫外線対策（SPF/PAの読み方）
    - 花粉・季節の変わり目のケア
  肌タイプ別:
    - 乾燥肌（セラミド+スクワラン推奨の理由）
    - 脂性肌（ナイアシンアミド推奨の理由）
    - 混合肌（ゾーン別ケア）
    - 敏感肌（避けるべき成分リスト）

beauty_trend:  # トレンド・新情報（動的に更新）
  # ※ このカテゴリはリサーチャーが自動追加可能
  - 新成分・新技術
  - 海外トレンド
  - 研究論文ベースの話題
