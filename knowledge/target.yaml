# ============================================================
# ターゲット定義（V2）
# Writer, Researcher が参照する「誰に届けるか」の設定
# ============================================================

# --- プライマリターゲット ---
primary:
  age_range: "25〜32歳"
  gender: "女性中心（男性も排除しない）"
  description: "働く女性。肌悩みが出始める年代。自分でスキンケアを選びたいが情報が多すぎて迷っている"
  budget: "月3,000〜10,000円"
  pain_points:
    - "成分表の読み方がわからない"
    - "どの情報を信じていいかわからない"
    - "SNSの製品レビューに振り回される"
    - "高いもの＝良いもの、と思い込んでいる"
    - "自分の肌質に合うものが判断できない"
  behavior:
    - "Instagram・Threadsで美容情報を収集"
    - "ドラッグストアでパッケージを見て選びがち"
    - "口コミサイトのランキングに依存"
    - "「無添加」「敏感肌用」等のキャッチコピーで判断"
  goal: "成分表を読めるようになり、自分で選べるようになる"

# --- セカンダリターゲット ---
secondary:
  age_range: "20〜24歳"
  description: "美容初心者。何から始めればいいかわからない層"
  budget: "月1,000〜3,000円（プチプラ中心）"
  pain_points:
    - "スキンケアの基本がそもそもわからない"
    - "友達や推しの真似をして選んでいる"
    - "成分を気にしたことがない"
  goal: "成分を意識するきっかけを得る"

# --- ターゲットに届くコンテンツの条件 ---
content_principles:
  - "専門用語は必ずカジュアルに言い換える"
  - "「今日からできる」具体的なアクションを含める"
  - "読者が「自分ごと」として受け取れる表現にする"
  - "マーケティング表現に惑わされない判断力を育てる"
  - "製品名は出さず、成分の読み方を教える"
