# ============================================================
# ジャンル定義（V2）
# 全エージェントが参照する「何について発信するか」の設定
# ============================================================

genre: "スキンケア成分知識"
focus: "成分の読み方を教える"
platform: "Threads"

# --- コンセプト ---
concept:
  mission: "読者が自分で選べるようになること"
  approach: "製品名を出さず、成分の読み方を教える"
  stance: "「ダメ」ではなく「知っておくべき」スタンス"
  differentiation: "成分知識メディア（製品レビューではない）"

# --- カテゴリ一覧 ---
# theme_tree.yaml のトップレベルと対応
categories:
  - id: skincare_ingredients
    name: "成分解説"
    description: "メインコンテンツ。個別成分の特徴・見分け方"
    priority: high
  - id: skincare_knowledge
    name: "基礎知識"
    description: "成分表の読み方、肌の仕組み、よくある誤解"
    priority: high
  - id: skincare_routine
    name: "ルーティン・使い方"
    description: "基本のステップ、季節別ケア、肌タイプ別"
    priority: medium
  - id: beauty_trend
    name: "トレンド・新情報"
    description: "新成分、海外トレンド、研究論文ベースの話題"
    priority: low

# --- コンテンツ配分 ---
content_ratio:
  拡散系: 60  # コメント誘導型、反常識型、短文完結型、二択比較型、あるある共感型
  保存系: 40  # リスト系、まとめ結論先出型、タイムライン型、数字インパクト型

# --- 収益モデル ---
monetization:
  model: "アフィリエイト"
  flow: "投稿（成分知識）→ CTA → プロフリンク → LP（成分条件フィルタ）→ 購入"
  lp_type: "成分条件チェッカー型LP"
  cta_rule: "CTA付き投稿には「※PRリンクあり」表記を付与（ステマ規制対応）"

# --- 避けるべき話題 ---
avoid_topics:
  - "特定ブランド・製品の推奨/批判"
  - "医療行為に関するアドバイス（皮膚科受診の推奨は可）"
  - "個人の容姿に関する価値判断"
  - "他アカウント・インフルエンサーの批判"
  - "政治・宗教・ジェンダー等のセンシティブな話題"
  - "根拠のない民間療法"
  - "価格による製品の優劣判断"

# --- 法令制約 ---
legal_constraints:
  primary_law: "薬機法（効能56項目の範囲内で表現）"
  secondary_laws:
    - "景品表示法（優良誤認・有利誤認の禁止）"
    - "ステマ規制（PR表記義務）"
  note: "「効く」「治る」「浸透する」等は使用不可。詳細は config/ng_words.txt 参照"
