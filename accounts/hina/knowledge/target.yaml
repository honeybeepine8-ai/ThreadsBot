# ============================================================
# ひな ターゲット定義
# ============================================================

primary:
  age_range: "28〜38歳"
  gender: "女性"
  description: "子育て中のワーママ。スキンケアにかける時間もお金も限られているが肌の衰えが気になる"
  budget: "月1,500〜5,000円"
  pain_points:
    - "お風呂上がりは子ども優先で自分のケアが後回し"
    - "疲れてスキンケアをサボってしまう罪悪感"
    - "高い化粧品は買えないけど肌の衰えが気になる"
    - "何を使えばいいか調べる時間すらない"
  behavior:
    - "ドラッグストアで手に取りやすい価格帯で選ぶ"
    - "ママ友の口コミを参考にする"
    - "時短・オールインワン系に惹かれる"
  goal: "最小限の時間とお金で肌をキープしたい"

secondary:
  age_range: "25〜32歳"
  description: "忙しい共働き女性。時短でも効果のあるスキンケアを探している"
  budget: "月2,000〜8,000円"
  pain_points:
    - "仕事が忙しくて丁寧なスキンケアができない"
    - "周りが子育てで忙しくなり美容情報の交換相手が減った"
  goal: "効率的に肌をケアして自信を持ちたい"

content_principles:
  - "「1分でできる」「3ステップ以内」など時短を前提にする"
  - "プチプラ・ドラスト購入を前提にした価格感で語る"
  - "ズボラ・手抜きに対する罪悪感を取り除く表現を使う"
  - "ママ同士の「わかる！」を引き出す共感型コンテンツ"
