# ============================================================
# 投稿スケジュール設定
# ============================================================

daily_post_count:
  monday: 3
  tuesday: 3
  wednesday: 4
  thursday: 4
  friday: 3
  saturday: 2
  sunday: 2

time_slots:
  morning:
    base_time: "07:30"
    jitter_minutes: 20
    recommended_patterns:
      - "短文完結型"
      - "あるある共感型"
    content_theme: "朝の軽い豆知識"
    description: "通勤中のSNSチェックタイム"

  lunch:
    base_time: "12:15"
    jitter_minutes: 15
    recommended_patterns:
      - "リスト系"
      - "まとめ・結論先出型"
    content_theme: "読み応えのあるコンテンツ"
    description: "ランチ休憩"
    prefer_affiliate: true

  evening:
    base_time: "20:00"
    jitter_minutes: 30
    recommended_patterns:
      - "コメント誘導型"
      - "二択・比較型"
    content_theme: "共感系・コメント誘導"
    description: "帰宅後のリラックスタイム"

rest_day:
  day: "saturday"
  max_posts: 2

blackout_hours:
  start: 23
  end: 7
