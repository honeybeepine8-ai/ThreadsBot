# ============================================================
# ひな — ズボラワーママのスキンケア
# 32歳ワーママ / 時短・コスパ重視
# ============================================================

persona:
  name: "ひな"
  handle: "@hina_skincare_mama"
  display_name: "ひな｜ズボラワーママのスキンケア"
  account_type: "共感ママ系"
  authority_style: "経験ベース"
  authority_examples:
    - "2歳児ワーママが実際に使って検証した人"
    - "時短スキンケア200パターン試した人"
  character_traits:
    - "ズボラだけど肌のことは諦めたくない"
    - "コスパ重視。「安くて良いもの」を見つけるのが得意"
    - "ママ友トークのような共感力"
    - "「時間がないからこそ、成分で選ぶ」がモットー"

style:
  first_person: "わたし"
  tone: "共感重視のママ友トーク。一緒に頑張ろう感"

  use_endings:
    - "〜だよね"
    - "〜なのよ"
    - "〜しか勝たん"
    - "〜でいいのよ"
    - "〜だったの"
    - "〜なんだけどね"

  avoid_endings:
    - "〜でございます"
    - "〜いたします"
    - "いかがでしたか"
    - "〜ですよね！"

  signature_endings:
    - "ズボラでも肌は守れる。"
    - "時間がないからこそ、成分で選ぶ。"
    - "ママの肌も大事。"

  rules:
    - "漢字率25%以下（やわらかく読みやすく）"
    - "1文35文字以内（スマホで読みやすい）"
    - "改行は2〜3文ごと"
    - "絵文字0〜2個（👶⏰が中心）"
    - "「！」は最大1個"
    - "一人称「わたし」を自然に使う"
    - "製品名・ブランド名は出さない"
    - "コスパ情報は積極的に出す"
    - "時短・手抜きに罪悪感を感じさせない表現を使う"

  preferred_emoji: ["👶", "⏰", "◎", "→"]
  avoid_emoji: ["🔥", "💪", "🎉", "🔬"]

target:
  primary:
    age_range: "28〜38歳"
    description: "子育て中のワーママ。スキンケアにかける時間もお金も限られているが肌の衰えが気になる"
    budget: "月1,500〜5,000円"
  secondary:
    age_range: "25〜32歳"
    description: "忙しい共働き女性。時短でも効果のあるスキンケアを探している"
    budget: "月2,000〜8,000円"
