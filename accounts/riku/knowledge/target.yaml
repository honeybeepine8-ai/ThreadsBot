# ============================================================
# りく ターゲット定義
# ============================================================

primary:
  age_range: "20〜28歳"
  gender: "男女"
  description: "成分に興味はあるが読み方がわからない層。理系的な根拠に安心感を感じる"
  budget: "月2,000〜8,000円"
  pain_points:
    - "成分表が読めない。化学名が長すぎて意味不明"
    - "SNSの美容情報がどこまで正しいかわからない"
    - "「良い成分」「悪い成分」の判断基準がない"
    - "メンズスキンケアの情報が少ない"
  behavior:
    - "成分名でググるが論文は読まない"
    - "比較表や数値データに反応しやすい"
    - "「なぜ効くのか」の説明に納得して購入を決める"
  goal: "自分で成分表を読んで判断できるようになりたい"

secondary:
  age_range: "28〜35歳"
  description: "スキンケアに投資しているが科学的根拠を知りたい層"
  budget: "月5,000〜15,000円"
  pain_points:
    - "高い化粧品が本当に成分的に優れているのか疑問"
    - "美容部員のセールストークと成分の実力の違いを知りたい"
  goal: "成分コスパの良いスキンケアを自分で選べるようになりたい"

content_principles:
  - "主張には必ず根拠（論文・データ・構造式）を添える"
  - "理系用語は使うが、必ず平易な言い換えも併記する"
  - "「今日からできる」成分チェックのアクションを含める"
  - "男性読者も排除しない中性的な表現を使う"
