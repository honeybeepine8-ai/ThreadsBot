genre: "あなたのジャンル名"
focus: "あなたのフォーカスポイント"
platform: "Threads"

concept:
  mission: "読者が達成できること"
  approach: "どのようなアプローチで"
  stance: "どのようなスタンスで"
  differentiation: "他との差別化ポイント"

categories:
  - id: category_1
    name: "カテゴリ1"
    description: "説明"
    priority: high
  - id: category_2
    name: "カテゴリ2"
    description: "説明"
