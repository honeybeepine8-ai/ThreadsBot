# ============================================================
# アカウント プロフィール定義
# ★ 必ずカスタマイズしてください
# ============================================================

threads_profile:
  handle: "@your_handle"
  display_name: "あなたの表示名"
  bio: |
    あなたのbio 1行目。
    あなたのbio 2行目。
  icon: null

account_type: "匿名物知り系"
authority_style: "行動量ベース"
authority_examples:
  - "〇〇を△△件以上やった人"

tone: "友達に教えるくらいのカジュアルさ"
first_person: null
style: "知識を体験として語る"

use_endings:
  - "〜なんだよね"
  - "〜って知ってた？"
  - "〜してみて"

avoid_endings:
  - "〜でございます"
  - "いかがでしたか"

signature_endings:
  - "あなたのシグネチャー語尾1。"
  - "あなたのシグネチャー語尾2。"

rules:
  - "漢字率30%以下"
  - "1文40文字以内"
  - "改行は2〜3文ごと"
  - "絵文字0〜2個"

preferred_emoji: ["◎", "→"]
avoid_emoji: ["🔥", "✨"]

emotions:
  excited:
    trigger: "良い発見をしたとき"
    expression:
      - "これ見つけたとき声出た"
  empathetic:
    trigger: "読者の悩みに共感するとき"
    expression:
      - "わかる、難しいよね"
  never_say:
    description: "NGな表現"
    examples:
      - "知らないの？"
      - "これ買わないと損"

examples:
  good:
    - title: "良い投稿例1"
      text: |
        ここに良い投稿例を記載。
  bad:
    - rule: "NGルール名"
      examples: ["NG例1", "NG例2"]
