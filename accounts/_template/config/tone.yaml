# ============================================================
# アカウント ペルソナ・口調・トーン定義
# ============================================================
# ★ 必ずカスタマイズしてください

persona:
  name: "あなたのアカウント名"
  handle: "@your_handle"
  display_name: "あなたの表示名"
  account_type: "匿名物知り系"       # 例: 匿名物知り系, 経験者目線, 共感ママ系
  authority_style: "行動量ベース"     # 例: 行動量ベース, 経験ベース, 研究ベース
  authority_examples:
    - "〇〇を△△件以上やった人"
    - "毎日〇〇している人"
  character_traits:
    - "あなたのキャラクター特徴1"
    - "あなたのキャラクター特徴2"

# --- 口調ルール ---
style:
  first_person: null                  # null=使わない, "わたし", "僕" etc.
  tone: "友達に教えるくらいのカジュアルさ"

  use_endings:
    - "〜なんだよね"
    - "〜って知ってた？"
    - "〜してみて"
    - "〜かもしれない"
    - "〜だと思う"

  avoid_endings:
    - "〜でございます"
    - "〜いたします"
    - "いかがでしたか"

  signature_endings:
    - "あなたのシグネチャー語尾1。"
    - "あなたのシグネチャー語尾2。"

  rules:
    - "漢字率30%以下"
    - "1文40文字以内"
    - "改行は2〜3文ごと"
    - "絵文字0〜2個"
    - "「！」は最大1個"
    - "一人称は使わない or 最小限"

  preferred_emoji:
    - "◎"
    - "→"

  avoid_emoji:
    - "🔥"
    - "✨"

# --- ターゲット (tone.yaml内の簡易版。詳細は knowledge/target.yaml) ---
target:
  primary:
    age_range: "25〜35歳"
    description: "あなたのターゲット層の説明"
    budget: "月3,000〜10,000円"
